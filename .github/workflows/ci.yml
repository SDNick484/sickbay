name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch and event. A push to a PR branch cancels that PR's previous run; pushes to main queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit, not a tag: a tag can be moved. The comment is the version the SHA
# was taken from.

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  alpine:
    # The container runs on Alpine's own py3-* packages, so test against exactly those.
    name: pytest (Alpine packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: alpine:latest
    steps:
      # git so actions/checkout makes a real clone (tests/test_hygiene.py and the privacy scan list files with git);
      # sqlite and tar for the backup tests (Task 9), which skip without them.
      - run: apk add --no-cache python3 py3-flask py3-gunicorn py3-jwt py3-cryptography py3-pytest git sqlite tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout belongs to another user than the container's root; let git read it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 -m pytest -q

  lint:
    name: ruff, node --check and node --test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The version pinned in requirements-dev.txt, without installing the app.
      - run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check
      # The runner's own Node is enough for a syntax check and for the built-in test runner.
      - name: node --check static/js/*.js
        run: |
          shopt -s nullglob
          node --version
          for f in static/js/*.js; do node --check "$f"; done
      - name: node --test tests/*.test.mjs
        run: |
          shopt -s nullglob
          files=(tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "No frontend tests yet."; exit 0; fi
          node --test "${files[@]}"

  shellcheck:
    name: shellcheck (sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-latest ships shellcheck.
      - run: |
          shopt -s nullglob
          files=(installer/*.sh ops/*)
          if [ ${#files[@]} -eq 0 ]; then echo "No shell scripts yet."; exit 0; fi
          shellcheck -s sh "${files[@]}"

  # No personal details in a public repo. Prints where and which rule, never the matched value.
  privacy-scan:
    name: Privacy scan (SteamIDs, IPs, emails, denylist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # every commit: authors, committers and messages are scanned too
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan files and commits
        env:
          # Newline-separated terms (hostnames, domain, names, device names). Not available to pull requests from
          # forks or to Dependabot; the scan then runs its pattern checks only and says so.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          HAVE_DENYLIST: ${{ secrets.PRIVACY_DENYLIST != '' }}
        run: |
          flag=""
          if [ "$HAVE_DENYLIST" = true ]; then
            flag="--require-denylist"
          else
            echo "::warning::PRIVACY_DENYLIST is not available to this run; only the pattern checks ran"
          fi
          python .github/scripts/privacy_scan.py $flag
